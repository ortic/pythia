[package]
name = "pythia-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The Oracle Instant Client (ODPI-C) instead of the pure-Rust driver, for
# setups the thin driver can't handle (Native Network Encryption required by
# the server, 11.2): `cargo build -p pythia-app --features pythia-db/thick`.
thick = ["dep:oracle"]

[dependencies]
# Which instant a region's local time is, where the clocks went back (#481);
# the driver brings both in already.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
futures-util.workspace = true
mysql.workspace = true
mysql_common.workspace = true
oracle = { workspace = true, optional = true }
oracledb.workspace = true
pythia-config.workspace = true
pythia-plsql.workspace = true
russh.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiberius.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[[example]]
name = "thin_probe"
# Compares the thin driver with the Instant Client.
required-features = ["thick"]
