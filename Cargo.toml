[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
pythia-ai = { path = "crates/pythia-ai" }
pythia-config = { path = "crates/pythia-config" }
pythia-compare = { path = "crates/pythia-compare" }
pythia-data = { path = "crates/pythia-data" }
pythia-db = { path = "crates/pythia-db" }
pythia-debugger = { path = "crates/pythia-debugger" }
pythia-lsp-core = { path = "crates/pythia-lsp-core" }
pythia-monitor = { path = "crates/pythia-monitor" }
pythia-plsql = { path = "crates/pythia-plsql" }
pythia-ui = { path = "crates/pythia-ui" }

eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
# Only for `--features pythia-db/thick` (ODPI-C, needs the Instant Client).
oracle = "0.6"
# The pure-Rust driver: our fork of oracle/rust-oracledb (branch `pythia`),
# upstream main plus fixes that aren't released yet and Connection::cancel()
# (#13), with rustls on ring (#99). Pinned to a commit.
oracledb = { git = "https://github.com/ortic/rust-oracledb", rev = "8dde2372336e1c4c9814a00d94f4eb6db7cff90c" }
# Pure Rust, synchronous like the session workers; rustls on ring as ureq uses.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "buffer-pool", "rustls-tls-ring"] }
# SSH tunnels: pure Rust on ring too. Its tokio runtime only carries the
# tunnels; the session workers stay synchronous.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# PostgreSQL and SQL Server: pure Rust async drivers, each session worker
# drives its own single-threaded runtime.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
# Our fork of tiberius (branch `pythia`): PRINT and informational messages
# reach the caller (#98), and rustls runs on ring instead of aws-lc (#99).
tiberius = { git = "https://github.com/ortic/tiberius", rev = "1ec36e8bbbcbb332de19c3bc65e9adaab074841c", default-features = false, features = ["tds80", "rustls-ring", "sql-browser-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false }
logos = "0.16"
regex = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
# The Oracle homes in the Windows registry (pythia-config::tns).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"
anyhow = "1"
thiserror = "2"
insta = "1"
serde_json = "1"
# Blocking HTTP for the AI backends (rustls, no async runtime).
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Keep dev builds small and fast: full debug info only for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized builds to run locally (`cargo run --profile fast -p pythia-app`):
# like release without its whole-program LTO, and incremental, so a change
# rebuilds in 5–15 s instead of release's two minutes (#99).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
