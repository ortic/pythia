[package]
name = "pythia-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast, native IDE for Oracle SQL and PL/SQL"
authors = ["Remo Laubacher"]
homepage = "https://github.com/ortic/pythia"
repository = "https://github.com/ortic/pythia"

[[bin]]
name = "pythia"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
regex.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
egui_plot = "0.37"
keyring.workspace = true
rfd = "0.17"
pythia-ai.workspace = true
pythia-compare.workspace = true
pythia-config.workspace = true
pythia-data.workspace = true
pythia-db.workspace = true
pythia-debugger.workspace = true
pythia-lsp-core.workspace = true
pythia-monitor.workspace = true
pythia-plsql.workspace = true
pythia-ui.workspace = true
serde.workspace = true
# Long MySQL values are checked by their digest when results are edited
# (data_edit.rs).
sha2 = "0.11"
# Windows Firewall settings (firewall.rs).
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Under WSLg the window opens through X11 (main.rs, #88); eframe's winit.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[build-dependencies]
# The icon and version resource of pythia.exe (build.rs).
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
# Changes a SQLite file behind Pythia's back (screenshots.rs tests).
rusqlite.workspace = true
# Reads the fonts' character maps (theme.rs tests); egui's has_glyph misses
# the characters of the font that holds its replacement glyph.
skrifa = "0.44"

# Installers and packages: `cargo packager --release -p pythia-app` (see README).
[package.metadata.packager]
productName = "Pythia"
identifier = "com.ortic.pythia"
publisher = "Remo Laubacher"
copyright = "Copyright © 2026 Remo Laubacher"
category = "DeveloperTool"
description = "Fast, native IDE for Oracle SQL and PL/SQL"
longDescription = """
Pythia covers the daily work of an Oracle developer: writing and running SQL,
editing and compiling PL/SQL, debugging, browsing objects, editing data,
comparing schemas and monitoring sessions. Connects to Oracle directly; no
Oracle client libraries are needed."""
homepage = "https://github.com/ortic/pythia"
licenseFile = "../../LICENSE-MIT"
# `cargo build --release -p pythia-app`, as an alias in .cargo/config.toml.
beforePackagingCommand = "cargo package-build"
outDir = "../../target/packages"
binariesDir = "../../target/release"
icons = ["../../assets/icon/pythia-32.png", "../../assets/icon/pythia-128.png", "../../assets/icon/pythia-256.png", "../../assets/icon/pythia-512.png", "../../assets/icon/pythia.ico", "../../assets/icon/pythia.icns"]
resources = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]

[[package.metadata.packager.binaries]]
path = "pythia"
main = true

[[package.metadata.packager.fileAssociations]]
extensions = ["sql"]
mimeType = "application/sql"
description = "SQL script"
name = "SQL script"
role = "editor"

[[package.metadata.packager.fileAssociations]]
extensions = ["pks", "pkb", "prc", "fnc", "tps", "tpb", "trg", "pls", "plb"]
mimeType = "text/x-plsql"
description = "PL/SQL source"
name = "PL/SQL source"
role = "editor"

[package.metadata.packager.deb]
desktopTemplate = "../../assets/linux/com.ortic.pythia.desktop"
section = "devel"

[package.metadata.packager.deb.files]
"../../assets/linux/com.ortic.pythia.metainfo.xml" = "usr/share/metainfo/com.ortic.pythia.metainfo.xml"
"../../assets/icon/pythia.svg" = "usr/share/icons/hicolor/scalable/apps/pythia.svg"

[package.metadata.packager.appimage.files]
"../../assets/linux/com.ortic.pythia.metainfo.xml" = "usr/share/metainfo/com.ortic.pythia.metainfo.xml"

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"

[package.metadata.packager.nsis]
installerIcon = "../../assets/icon/pythia.ico"
installMode = "perMachine"

[package.metadata.packager.wix]
languages = ["en-US"]
